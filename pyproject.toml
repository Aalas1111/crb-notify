[project]
name = "crb-notify"
version = "0.1.0"
description = "教室借用申请结果的接收器：收浏览器插件投来的申请记录 → 判定 → 出通知"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "NOVA Contributors" }]
keywords = ["crb", "nju", "classroom-booking", "notification", "intake"]

dependencies = [
    "starlette>=0.37",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",   # starlette.testclient 用它
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
crb-notify = "crb_notify.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "scripts/**", "deploy/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
